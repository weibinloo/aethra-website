<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Aethra</title>
  <desc id="desc">Data and AI strategy consulting for companies.</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#5fd2ff" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#57f0c0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#070b12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5fd2ff"/>
      <stop offset="100%" stop-color="#57f0c0"/>
