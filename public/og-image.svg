  <circle cx="600" cy="300" r="44" fill="url(#line)"/>
  <text x="600" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="18" fill="#eaf4ff">AETHRA</text>
  <text x="600" y="556" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#a8bed5">Data and AI strategy that delivers in production</text>
</svg>
